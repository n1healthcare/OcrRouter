[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrrouter"
dynamic = ["version"]
authors = [
    {name = "Tan Jun An", email = "jun.an@n1.healthcare"}
]
license = "AGPL-3.0"
description = "A practical tool for converting PDF to Markdown"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.13"
keywords = ["magic-pdf", "convert", "pdf", "markdown", "ocr", "router"]
classifiers = [
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "loguru>=0.7.2",
    "numpy>=1.21.6",
    "tqdm>=4.67.1",
    "requests",
    "httpx",
    "pillow>=11.0.0",
    "pypdfium2>=4.30.0",
    "pypdf>=5.6.0",
    "reportlab",
    "beautifulsoup4>=4.13.5,<5",
    "magika>=0.6.2,<1.1.0",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "packaging>=21.0",
    "aiofiles>=25.1.0",
    "pydantic-settings>=2.12.0",
    "langfuse>=3.11.1",
    "langchain>=1.2.0",
    "transformers>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.1.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
]

[tool.setuptools.dynamic]
version = { attr = "ocrrouter.version.__version__" }

[tool.setuptools.packages.find]
include = ["ocrrouter*"]
namespaces = false

[project.urls]
Homepage = "https://github.com/n1healthcare/OcrRouter"
Repository = "https://github.com/n1healthcare/OcrRouter"
Issues = "https://github.com/n1healthcare/OcrRouter/issues"
Documentation = "https://github.com/n1healthcare/OcrRouter#readme"

[tool.setuptools]
zip-safe = false

# Ruff configuration
[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E731",   # do not assign lambda expression, use def
    "B007",   # loop control variable not used within loop body
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise from within except
    "B905",   # zip() without explicit strict parameter (not critical for Python 3.13)
    "C401",   # unnecessary generator (rewrite as set comprehension)
    "C402",   # unnecessary generator (rewrite as dict comprehension)
    "C403",   # unnecessary list comprehension (rewrite as set comprehension)
    "C405",   # unnecessary list literal (rewrite as set literal)
    "C416",   # unnecessary list comprehension - rewrite using list()
    "C417",   # unnecessary map usage (map is fine in many cases)
    "F841",   # local variable assigned but never used (sometimes needed for unpacking)
    "ARG001", # unused function argument (sometimes needed for interface compatibility)
    "ARG002", # unused method argument (kwargs often intentionally unused)
    "SIM102", # nested if statements (sometimes more readable than combined conditions)
    "SIM103", # return condition directly (if-else can be clearer)
    "SIM105", # use contextlib.suppress (try-except-pass is explicit and clear)
    "SIM108", # ternary operator (if-else can be more readable)
    "SIM110", # use any() instead of for loop (for loop can be clearer)
    "SIM117", # nested with statements (sometimes more readable)
    "UP006",  # use type instead of Type (requires from __future__ import annotations)
    "UP035",  # import from collections.abc (deprecated warnings acceptable)
    "UP047",  # generic function type parameters (requires more complex refactoring)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"demo/*.py" = ["ARG", "SIM"]  # demo files can be simpler

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Mypy configuration
[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "loguru.*",
    "pypdfium2.*",
    "reportlab.*",
    "magika.*",
    "langchain.*",
    "langchain_openai.*",
    "langchain_core.*",
    "langfuse.*",
    "transformers.*",
]
ignore_missing_imports = true
